name: NEMO CODE CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      installer_mode:
        description: "Enable installer transition checks"
        required: false
        default: false
        type: boolean
      real_mcp_gate:
        description: "Require real NEMO MCP continuity gate"
        required: false
        default: false
        type: boolean

env:
  INSTALLER_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.installer_mode && 'true' || vars.INSTALLER_MODE || 'false' }}
  NEMOCODE_REAL_MCP_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && inputs.real_mcp_gate && '1' || vars.NEMOCODE_REAL_MCP_REQUIRED || '0' }}

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run backend unit tests
        run: python -m unittest discover -s tests

      - name: Run release confidence and RC readiness gates
        run: |
          mkdir -p artifacts
          python -m unittest tests.test_release_confidence_e2e tests.test_global_mvp_gate tests.test_desktop_release_readiness_contract > artifacts/release-confidence.txt
          cat artifacts/release-confidence.txt

      - name: Run required real NEMO MCP continuity gate
        if: ${{ env.NEMOCODE_REAL_MCP_REQUIRED == '1' }}
        run: |
          python -m unittest tests.test_mission_control_server.MissionControlServerTests.test_mcp_native_real_server_continuity_across_sessions_and_core_tools

      - name: Generate release confidence evidence
        run: |
          python -m tests.generate_release_confidence_evidence --json-out artifacts/release-confidence.json --md-out artifacts/release-confidence.md
          cat artifacts/release-confidence.md

      - name: Generate release go/no-go dossier
        run: |
          python scripts/generate-release-go-no-go.py --json-out artifacts/release-go-no-go.json --md-out artifacts/release-go-no-go.md --allow-missing-release-bundle
          cat artifacts/release-go-no-go.md

      - name: Enforce benchmark regression gate evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("artifacts/release-confidence.json").read_text(encoding="utf-8"))
          gate = payload["release_confidence"]["benchmark_gate"]

          errors = []
          if gate.get("baseline_exit_code") != 0:
            errors.append(f"baseline_exit_code expected 0, got {gate.get('baseline_exit_code')}")
          if gate.get("pass_case_exit_code") != 0:
            errors.append(f"pass_case_exit_code expected 0, got {gate.get('pass_case_exit_code')}")
          if not gate.get("pass_case_passed"):
            errors.append("pass_case_passed expected true")
          if gate.get("fail_case_exit_code") != 1:
            errors.append(f"fail_case_exit_code expected 1, got {gate.get('fail_case_exit_code')}")
          if gate.get("fail_case_passed"):
            errors.append("fail_case_passed expected false")
          if int(gate.get("fail_case_violation_count", 0)) < 1:
            errors.append("fail_case_violation_count expected >= 1")

          if errors:
            print("benchmark regression gate evidence check failed")
            for error in errors:
              print(f"- {error}")
            raise SystemExit(1)

          print("benchmark regression gate evidence check passed")
          PY

      - name: Upload release confidence evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-confidence-evidence
          path: |
            artifacts/release-confidence.txt
            artifacts/release-confidence.json
            artifacts/release-confidence.md
            artifacts/release-go-no-go.json
            artifacts/release-go-no-go.md

  installer-preview:
    name: Installer Preview
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.installer_mode == true) || (github.event_name != 'workflow_dispatch' && vars.INSTALLER_MODE == 'true') }}
    needs: backend-tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/nemo-desktop/package-lock.json

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download release dossier evidence
        uses: actions/download-artifact@v4
        with:
          name: release-confidence-evidence
          path: artifacts

      - name: Fail installer preview when release decision is no-go
        shell: pwsh
        run: |
          $decisionFile = "artifacts/release-go-no-go.json"
          if (-not (Test-Path $decisionFile)) {
            throw "Missing required release decision file: $decisionFile"
          }

          $decisionPayload = Get-Content -Path $decisionFile -Raw | ConvertFrom-Json
          if ($decisionPayload.decision -ne "go") {
            throw "Installer preview blocked because release decision is '$($decisionPayload.decision)'"
          }

          Write-Host "Installer preview allowed by release decision: go"

      - name: Install desktop dependencies
        working-directory: apps/nemo-desktop
        run: npm ci

      - name: Build desktop installer
        working-directory: apps/nemo-desktop
        run: npm run tauri:build

      - name: Validate first-run contract surface
        run: python -m unittest tests.test_desktop_release_readiness_contract

      - name: Generate installer evidence report
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/installer -Force | Out-Null
          $targetRoot = "apps/nemo-desktop/src-tauri/target"
          if (-not (Test-Path $targetRoot)) {
            throw "Installer build target path not found: $targetRoot"
          }

          $installers = Get-ChildItem -Path $targetRoot -Recurse -File | Where-Object { $_.Extension -in @('.msi', '.exe') }
          if (-not $installers -or $installers.Count -eq 0) {
            throw "No installer artifacts (.msi/.exe) found under $targetRoot"
          }

          $repoRoot = (Resolve-Path .).Path
          $rows = @()
          foreach ($installer in $installers) {
            $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $relativePath = [System.IO.Path]::GetRelativePath($repoRoot, $installer.FullName).Replace('\\', '/')
            $rows += [ordered]@{
              path = $relativePath
              size_bytes = $installer.Length
              sha256 = $hash
            }
          }

          $payload = [ordered]@{
            installer_mode = $env:INSTALLER_MODE
            generated_at_utc = (Get-Date).ToUniversalTime().ToString("o")
            artifacts = $rows
          }
          $payload | ConvertTo-Json -Depth 6 | Set-Content -Path artifacts/installer/installer-evidence.json -Encoding UTF8

          $md = @(
            "# Installer Build Evidence",
            "",
            "Installer mode: **$($env:INSTALLER_MODE)**",
            "",
            "## Artifacts"
          )
          foreach ($row in $rows) {
            $md += "- $($row.path) ($($row.size_bytes) bytes, sha256=$($row.sha256))"
          }
          $md | Set-Content -Path artifacts/installer/installer-evidence.md -Encoding UTF8

      - name: Upload installer transition evidence
        uses: actions/upload-artifact@v4
        with:
          name: installer-transition-evidence
          path: |
            artifacts/installer/installer-evidence.json
            artifacts/installer/installer-evidence.md
            apps/nemo-desktop/src-tauri/target/**/*.msi
            apps/nemo-desktop/src-tauri/target/**/*.exe

  mission-control:
    name: Mission Control
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/mission-control/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/mission-control
        run: npm install

      - name: Validate Mission Control interactive controls
        working-directory: apps/mission-control
        run: npm run check:controls

      - name: Run Mission Control smoke tests
        working-directory: apps/mission-control
        run: npm run test:smoke

      - name: Build Mission Control
        working-directory: apps/mission-control
        run: npm run build
